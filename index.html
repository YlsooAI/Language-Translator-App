<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">  
    <title>Yavqo | Professional Language Solutions</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Animated Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <header class="main-header">
      <div class="header-content">
        <div class="logo">
          <i class="fas fa-globe-americas"></i>
          <span>Yavqo</span>
        </div>
        <nav class="nav-links">
          <a href="#">Solutions</a>
          <a href="#">Enterprise</a>
          <a href="#">API</a>
          <a href="#">Support</a>
        </nav>
      </div>
    </header>

    <div class="container">
      <div class="translator-card">
        <div class="card-header">
          <div class="custom-dropdown" id="from-language-dropdown">
            <div class="dropdown-trigger">
              <span class="selected-text">Detect Language</span>
              <i class="fas fa-chevron-down"></i>
            </div>
            <div class="dropdown-menu">
              <input type="text" class="dropdown-search" placeholder="Search language...">
              <div class="dropdown-options"></div>
            </div>
          </div>
          
          <button class="exchange-btn" title="Swap languages">
            <i class="fas fa-exchange-alt"></i>
          </button>
          
          <div class="custom-dropdown" id="to-language-dropdown">
            <div class="dropdown-trigger">
              <span class="selected-text">Spanish</span>
              <i class="fas fa-chevron-down"></i>
            </div>
            <div class="dropdown-menu">
              <input type="text" class="dropdown-search" placeholder="Search language...">
              <div class="dropdown-options"></div>
            </div>
          </div>
        </div>

        <div class="text-input">
          <div class="input-panel">
            <textarea spellcheck="false" class="from-text" placeholder="Enter text to translate..."></textarea>
            <div class="panel-actions">
              <span class="char-count">0 / 5000</span>
            </div>
          </div>
          
          <div class="input-panel output-panel">
            <textarea spellcheck="false" readonly disabled class="to-text" placeholder="Translation"></textarea>
            <div class="panel-actions">
              <button class="action-btn" id="to-copy" title="Copy">
                <i class="fas fa-copy"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="translation-status">
          <div class="loading-indicator">
            <div class="spinner"></div>
            <span class="status-text">Translating...</span>
          </div>
        </div>
      </div>

      <footer class="footer">
        <p>&copy; 2024 Yavqo. All rights reserved.</p>
      </footer>
    </div>

    <script src="js/countries.js"></script>
    <script src="js/script.js"></script>

  </body>
</html>
